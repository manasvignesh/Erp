spring.application.name=eventflow
server.port=${PORT:8080}

# Local demo defaults to a persistent H2 file database.
# For MySQL set DB_URL, DB_USER and DB_PASSWORD in the host environment.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/nlscdb;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.error.include-message=always
server.compression.enabled=true
